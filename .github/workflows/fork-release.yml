# Fork release pipeline: Prime Agent (drvova build) on GitHub Releases.
#
# A vX.Y.Z-drvova.N tag on drvova/prime-agent builds release.yml's Linux
# (x64, arm64) and Windows (x64) targets. macOS is not built: GitHub never
# assigned this repository a macOS runner. It packages them with the same scripts
# (scripts/release/split_debug.py, bundle_catalog.py, assemble_artifacts.py,
# the install-cargo-about action), merges them with release.yml's OWN
# promote steps (extracted from release.yml at run time, so the merged
# manifest and SHA256SUMS keep the official shape), and publishes one GitHub
# Release on this repository: the tarballs, SHA256SUMS, the `stable` pointer,
# latest.json, and the rendered installers (install.sh, install.ps1) plus
# prime-switch(.ps1). No R2, no org secrets: the publish job holds only
# GITHUB_TOKEN with contents: write.
#
# THREE TRIGGERS, ONE PATH: a pushed fork tag, a dispatch with a `tag`
# input, and - the default - automatically after `ci` passes on a push to
# main. tag-check resolves every trigger to the same outputs (release, tag,
# version, sha, previous) and every later job reads only those.
#
# THE AUTOMATIC RELEASE: when `ci` (ci.yml) completes successfully for a
# push to main, tag-check plans the next tag (fork_release.py next-tag: N is
# one past the highest N on Cargo.toml's version, 1 for a new version) and
# diffs the previous fork release against the commit CI tested
# (workflow_run.head_sha - NOT github.sha, which is main's tip when the run
# starts). It releases only when that range changed shipped code
# (fork_release.py should-release); docs, .changes/ and other-workflow
# changes end the run green with a "no release" line. Automatic and
# dispatched runs share the fork-release-auto concurrency group, so two quick
# merges release in order and the later one plans after the earlier one
# published; a commit that already carries a fork tag, or that is behind the
# latest fork release (its ci run finished late), is skipped.
#
# THE TAG SCHEME: vX.Y.Z-drvova.N, where X.Y.Z is the workspace version in
# Cargo.toml (unchanged - the fork stamps its version at packaging time:
# assemble_artifacts.py writes X.Y.Z-drvova.N into the archive's
# package.json, which `prime-agent --version` reports). release.yml's tag
# filters (vX.Y.Z and vX.Y.Z-beta*) never match it, and this filter never
# matches an official tag (crates/pa-cli/tests/fork_switch_e2e.rs pins both).
#
# THE DISTRIBUTION STAMP: the PRIME_AGENT_DIST_* variables below compile
# into the binary (pa-core update::installer::BUILD_DISTRIBUTION), so a fork
# binary's `prime update` fetches this repository's install.sh and
# latest.json and installs into ~/.local/share/prime-agent-fork - never the
# official channel or the official prefix - and its help and update text
# name the fork's own command, `prime` (PRIME_AGENT_DIST_COMMAND; the
# official build keeps `prime-agent`).
#
# THE BUNDLED INSTALLER: the binary embeds install-rust.sh for its local
# `update --rollback` / `--archive` runs, so each build job renders the fork
# knobs into the checkout's install-rust.sh first (the same render as the
# published install.sh): a fork rollback republishes the `prime` launcher
# with its socket and venv pins, never an unpinned `prime-agent` one.

name: fork-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-drvova.[0-9]+"
  # The same release, started from the Actions tab (or the API) on main: the
  # publish job creates the tag at the dispatched commit, so cutting a release
  # needs no tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: "Fork tag to create and publish, e.g. v0.10.3-drvova.1 (vX.Y.Z must match Cargo.toml)"
        required: true
        type: string
  # The automatic release: after ci.yml passes on a push to main (tag-check
  # requires conclusion == success and event == push).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

# A pushed tag builds in its own group; automatic and dispatched runs create
# tags on main and queue in one group, so each plans after the last one
# published.
concurrency:
  group: ${{ github.event_name == 'push' && format('fork-release-{0}', github.ref) || 'fork-release-auto' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PRIME_AGENT_DIST_NAME: Prime Agent (drvova build)
  PRIME_AGENT_DIST_INSTALLER_URL: https://github.com/${{ github.repository }}/releases/latest/download/install.sh
  PRIME_AGENT_DIST_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
  PRIME_AGENT_DIST_HOME_PREFIX: .local/share/prime-agent-fork
  PRIME_AGENT_DIST_COMMAND: prime
  # fork_release.py render's distribution arguments, shared by the bundled
  # render (build jobs) and the published one (publish job).
  FORK_ASSETS_URL: https://github.com/${{ github.repository }}/releases/download
  FORK_VARIANT: fork

jobs:
  tag-check:
    # The fork's own pipeline: the official repository never runs it. An
    # automatic run starts only after a green ci run for a push to main.
    if: >-
      ${{ github.repository == 'drvova/prime-agent' && (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      # The commit to release: the one ci tested for an automatic run, the
      # tag's commit for a push, main's for a dispatch. Full history and tags
      # for next-tag and the diff since the previous release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Plan the release (tag, commit, shipped-code filter)
        id: plan
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          plan=(python3 scripts/release/fork_release.py next-tag --suffix drvova --cargo-toml Cargo.toml)
          release=true
          case "${GITHUB_EVENT_NAME}" in
            push)
              [[ "${GITHUB_REF_TYPE}" == "tag" ]] || { echo "ref is not a tag"; exit 1; }
              sha="${GITHUB_SHA}"
              plan+=(--release-tag "${GITHUB_REF_NAME}")
              ;;
            workflow_dispatch)
              # A dispatched release is cut from main only, under a tag that
              # does not exist yet (the publish job creates it).
              [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "dispatch a release from main, not ${GITHUB_REF}"; exit 1; }
              if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${DISPATCH_TAG}" >/dev/null; then
                echo "tag ${DISPATCH_TAG} already exists: push it to rebuild, or dispatch a new tag"; exit 1
              fi
              sha="${GITHUB_SHA}"
              plan+=(--release-tag "${DISPATCH_TAG}")
              ;;
            workflow_run)
              sha="${RUN_HEAD_SHA}"
              ;;
            *)
              echo "unexpected event ${GITHUB_EVENT_NAME}"; exit 1
              ;;
          esac
          git tag -l > "${RUNNER_TEMP}/tags"
          "${plan[@]}" < "${RUNNER_TEMP}/tags" > "${RUNNER_TEMP}/plan"
          tag="$(sed -n 's/^tag=//p' "${RUNNER_TEMP}/plan")"
          previous="$(sed -n 's/^previous=//p' "${RUNNER_TEMP}/plan")"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && -n "${previous}" ]]; then
            released="$(git tag --points-at "${sha}" | grep -E -- '-drvova\.[0-9]+$' || true)"
            if [[ -n "${released}" ]]; then
              echo "no release: ${sha} is already released as ${released//$'\n'/, }"
              release=false
            elif ! git merge-base --is-ancestor "${previous}" "${sha}"; then
              echo "no release: ${sha} is behind the latest fork release ${previous}"
              release=false
            else
              git diff --no-renames --name-only "${previous}" "${sha}" > "${RUNNER_TEMP}/changed"
              release="$(python3 scripts/release/fork_release.py should-release < "${RUNNER_TEMP}/changed" | sed -n 's/^release=//p')"
              [[ "${release}" == "true" ]] || echo "no release: nothing shipped changed since ${previous} (docs, .changes/ or other workflows only)"
            fi
          fi
          version="$(python3 scripts/release/fork_release.py version \
            --tag "${tag}" --suffix drvova --cargo-toml Cargo.toml)"
          echo "fork release ${version} at ${sha} (previous: ${previous:-none}, release: ${release})"
          {
            echo "release=${release}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "sha=${sha}"
            echo "previous=${previous}"
          } >> "${GITHUB_OUTPUT}"

  # The prime-agent-catalog commit every build bundles (release.yml's job).
  catalog-ref:
    needs: tag-check
    # Every later job runs only for a planned release (the build jobs need
    # this one, so a skipped plan skips them and publish).
    if: ${{ needs.tag-check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.tag-check.outputs.sha }}
      - name: Resolve prime-agent-catalog main
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(python3 scripts/release/bundle_catalog.py resolve-ref)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  # release.yml's build-gnu job: the same digest-pinned ubuntu:22.04
  # container (the glibc 2.35 baseline) on GitHub-hosted x64 and arm64
  # runners, the same split-debug and assemble steps.
  build-gnu:
    needs: [tag-check, catalog-ref]
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    container:
      image: mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            runs-on: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            runs-on: ubuntu-24.04-arm
    env:
      COPYFILE_DISABLE: "1"
      VERSION: ${{ needs.tag-check.outputs.version }}
    steps:
      - name: Install build prerequisites (Ubuntu 22.04 container)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates python3 git binutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.tag-check.outputs.sha }}
      - name: Trust the mounted checkout for release packaging
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fork-${{ matrix.target }}-glibc235
      - name: Bundle the fork-rendered installer (update --rollback / --archive run it)
        run: |
          set -euo pipefail
          cp install-rust.sh "${RUNNER_TEMP}/install-rust.official.sh"
          python3 scripts/release/fork_release.py render --repo-root . \
            --download-base "${PRIME_AGENT_DIST_DOWNLOAD_BASE_URL}" --assets-url "${FORK_ASSETS_URL}" \
            --home-prefix "${PRIME_AGENT_DIST_HOME_PREFIX}" --variant "${FORK_VARIANT}" \
            --command "${PRIME_AGENT_DIST_COMMAND}" --out-dir "${RUNNER_TEMP}/fork-render"
          cp "${RUNNER_TEMP}/fork-render/install.sh" install-rust.sh
      - name: Build (release, locked, distribution-stamped)
        run: cargo build --release --locked --target ${{ matrix.target }} -j 4 -p pa-cli --bin prime-agent
      - name: Split the shipped binary + split-debug decoder
        run: |
          set -euo pipefail
          python3 scripts/release/split_debug.py \
            --binary "target/${{ matrix.target }}/release/prime-agent" \
            --shipped "target/${{ matrix.target }}/dist/prime-agent" \
            --out "target/${{ matrix.target }}/dist" \
            --version "${VERSION}" \
            --target "${{ matrix.target }}"
      - name: "GLIBC baseline gate: no symbols above GLIBC_2.35 (Ubuntu 22.04)"
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/dist/prime-agent"
          syms="$(objdump -T "${bin}" | grep -o 'GLIBC_[0-9.]*' || true)"
          [ -n "${syms}" ] || { echo "::error::no GLIBC symbols found in ${bin}"; exit 1; }
          max_glibc="$(printf '%s\n' "${syms}" | sort -Vu | tail -1)"
          top="$(printf '%s\nGLIBC_2.35\n' "${max_glibc}" | sort -Vu | tail -1)"
          [ "${top}" = "GLIBC_2.35" ] || { echo "::error::binary requires ${max_glibc}"; exit 1; }
      - name: Generate bundled catalog assets (live catalog)
        env:
          CATALOG_REF: ${{ needs.catalog-ref.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release/bundle_catalog.py generate --network \
            --catalog-ref "${CATALOG_REF}" --out "target/${{ matrix.target }}/catalog-assets"
      - name: Install cargo-about (renders the archive's third-party notices)
        uses: ./.github/actions/install-cargo-about
      - name: Assemble tarball + checksums + manifest
        run: |
          set -euo pipefail
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${VERSION}" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/dist/prime-agent" \
            --decoder "target/${{ matrix.target }}/dist/prime-agent-${VERSION}-${{ matrix.platform }}.debug.gz" \
            --catalog-assets "target/${{ matrix.target }}/catalog-assets" \
            --out-dir "target/${{ matrix.target }}/dist"
      - name: "Livecheck gate: the packaged build reports the fork version and updates from the fork"
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          tar -xzf "target/${{ matrix.target }}/dist/prime-agent-${VERSION}-${{ matrix.platform }}.tar.gz" -C "${check}"
          out="$("${check}/prime-agent" --version)"
          [ "${out}" = "${VERSION}" ] || { echo "::error::the package reports '${out}', expected '${VERSION}'"; exit 1; }
          "${check}/prime-agent" --help | grep -qF "  ${PRIME_AGENT_DIST_COMMAND} [options]" \
            || { echo "::error::the help does not name the fork's ${PRIME_AGENT_DIST_COMMAND} command"; exit 1; }
          update="$(HOME="${check}/home" PI_OFFLINE=1 "${check}/prime-agent" update --check 2>&1 || true)"
          printf '%s\n' "${update}"
          printf '%s\n' "${update}" | grep -qF "${PRIME_AGENT_DIST_DOWNLOAD_BASE_URL}/latest.json" \
            || { echo "::error::update --check does not read the fork channel"; exit 1; }
      - name: Verify fresh channel install and reinstall
        run: |
          set -euo pipefail
          # The official installer (the checkout's copy carries the fork
          # render now): the archive installs through the shared layout.
          python3 scripts/release/test_channel_install.py \
            --archive "target/${{ matrix.target }}/dist/prime-agent-${VERSION}-${{ matrix.platform }}.tar.gz" \
            --installer "${RUNNER_TEMP}/install-rust.official.sh" \
            --report "target/${{ matrix.target }}/dist/channel-install.json"
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/prime-agent-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
          if-no-files-found: error

  # release.yml's build-windows job on the GitHub-hosted windows-latest
  # image: the static VC runtime (RUSTFLAGS +crt-static) and the same
  # assemble step; install.ps1 extracts this archive's prime-agent.exe.
  build-windows:
    needs: [tag-check, catalog-ref]
    name: build-x86_64-pc-windows-msvc
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.tag-check.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.tag-check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fork-x86_64-pc-windows-msvc
      - name: Resolve the Python interpreter
        shell: bash
        run: echo "PY=$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - name: Bundle the fork-rendered installer (update --rollback / --archive run it)
        shell: bash
        run: |
          set -euo pipefail
          "${PY}" scripts/release/fork_release.py render --repo-root . \
            --download-base "${PRIME_AGENT_DIST_DOWNLOAD_BASE_URL}" --assets-url "${FORK_ASSETS_URL}" \
            --home-prefix "${PRIME_AGENT_DIST_HOME_PREFIX}" --variant "${FORK_VARIANT}" \
            --command "${PRIME_AGENT_DIST_COMMAND}" --out-dir "${RUNNER_TEMP}/fork-render"
          cp "${RUNNER_TEMP}/fork-render/install.sh" install-rust.sh
      - name: Build (release, locked, static CRT, distribution-stamped)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -j 4 -p pa-cli --bin prime-agent
      - name: Generate bundled catalog assets (live catalog)
        shell: bash
        env:
          CATALOG_REF: ${{ needs.catalog-ref.outputs.sha }}
        run: |
          set -euo pipefail
          "${PY}" scripts/release/bundle_catalog.py generate --network \
            --catalog-ref "${CATALOG_REF}" --out "target/x86_64-pc-windows-msvc/catalog-assets"
      - name: Install cargo-about (renders the archive's third-party notices)
        uses: ./.github/actions/install-cargo-about
      - name: Assemble tarball + checksums + manifest
        shell: bash
        run: |
          set -euo pipefail
          "${PY}" scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${VERSION}" \
            --target x86_64-pc-windows-msvc \
            --binary "target/x86_64-pc-windows-msvc/release/prime-agent.exe" \
            --catalog-assets "target/x86_64-pc-windows-msvc/catalog-assets" \
            --out-dir "target/x86_64-pc-windows-msvc/dist"
      - name: "Livecheck gate: the packaged build reports the fork version and updates from the fork"
        shell: bash
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          tar -xzf "target/x86_64-pc-windows-msvc/dist/prime-agent-${VERSION}-win32-x64.tar.gz" -C "${check}"
          out="$("${check}/prime-agent.exe" --version | tr -d '\r')"
          [ "${out}" = "${VERSION}" ] || { echo "::error::the package reports '${out}', expected '${VERSION}'"; exit 1; }
          "${check}/prime-agent.exe" --help | tr -d '\r' | grep -qF "  ${PRIME_AGENT_DIST_COMMAND} [options]" \
            || { echo "::error::the help does not name the fork's ${PRIME_AGENT_DIST_COMMAND} command"; exit 1; }
          update="$(USERPROFILE="$(cygpath -w "${check}")" HOME="${check}" PI_OFFLINE=1 "${check}/prime-agent.exe" update --check 2>&1 || true)"
          printf '%s\n' "${update}"
          printf '%s\n' "${update}" | grep -qF "${PRIME_AGENT_DIST_DOWNLOAD_BASE_URL}/latest.json" \
            || { echo "::error::update --check does not read the fork channel"; exit 1; }
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-x86_64-pc-windows-msvc
          path: |
            target/x86_64-pc-windows-msvc/dist/prime-agent-*
            target/x86_64-pc-windows-msvc/dist/SHA256SUMS
            target/x86_64-pc-windows-msvc/dist/manifest.json
          if-no-files-found: error

  publish:
    needs: [tag-check, build-gnu, build-windows]
    if: ${{ needs.tag-check.outputs.release == 'true' }}
    name: publish the GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.tag-check.outputs.version }}
      RELEASE_TAG: ${{ needs.tag-check.outputs.tag }}
      RELEASE_SHA: ${{ needs.tag-check.outputs.sha }}
      PREVIOUS_TAG: ${{ needs.tag-check.outputs.previous }}
    steps:
      # Full history: the notes list the changes since the previous release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: source
          ref: ${{ needs.tag-check.outputs.sha }}
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: incoming
      # THE REUSE: release.yml's own promote steps, run verbatim (yq is on
      # the GitHub-hosted ubuntu image), so the fork's merged manifest and
      # SHA256SUMS are exactly the official shape.
      - name: Run release.yml's layout, hash-continuity, and merge steps
        run: |
          set -euo pipefail
          for step in \
            "Normalize download layout (single-artifact runs land flat)" \
            "Verify hash continuity (artifacts match build-job manifests)" \
            "Merge per-target manifests + SHA256SUMS"; do
            body="$(STEP="${step}" yq -r '.jobs.promote.steps[] | select(.name == strenv(STEP)) | .run' source/.github/workflows/release.yml)"
            [ -n "${body}" ] && [ "${body}" != "null" ] || { echo "::error::release.yml has no promote step '${step}'"; exit 1; }
            echo "::group::${step}"
            printf '%s\n' "${body}" > "${RUNNER_TEMP}/step.sh"
            bash -e "${RUNNER_TEMP}/step.sh"
            echo "::endgroup::"
          done
      - name: Emit the channel (latest.json + stable) and render the installers
        run: |
          set -euo pipefail
          python3 source/scripts/release/fork_release.py channel \
            --manifest release-out/manifest.json --version "${VERSION}" \
            --platforms linux-arm64,linux-x64,win32-x64 --out-dir release-out
          python3 source/scripts/release/fork_release.py render \
            --repo-root source \
            --download-base "${PRIME_AGENT_DIST_DOWNLOAD_BASE_URL}" \
            --assets-url "${FORK_ASSETS_URL}" \
            --home-prefix "${PRIME_AGENT_DIST_HOME_PREFIX}" \
            --variant "${FORK_VARIANT}" \
            --command "${PRIME_AGENT_DIST_COMMAND}" \
            --out-dir release-out
          sh -n release-out/install.sh
          sh -n release-out/prime-switch
          (cd release-out && sha256sum install.sh install.ps1 prime-switch prime-switch.ps1 latest.json >> SHA256SUMS)
          (cd release-out && sha256sum --check SHA256SUMS)
          cat release-out/latest.json
      - name: Publish the GitHub Release (the latest release serves the channel)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/notes.md" <<NOTES
          Prime Agent (drvova build) ${VERSION}. Its command is \`prime\`: \`prime\`, \`prime --version\`, \`prime update\`.

          It installs side by side with the official \`prime-agent\` and never touches it (prefix ~/.local/share/prime-agent-fork):

              curl -fsSL https://github.com/${GH_REPO}/releases/latest/download/install.sh | sh

          Windows (PowerShell):

              irm https://github.com/${GH_REPO}/releases/latest/download/install.ps1 | iex

          Prime Intellect's own CLI is also called \`prime\`. The installer never replaces it and tells you which \`prime\` comes first on PATH. See FORK.md for that and for prime-switch.
          NOTES
          # The first-parent log since the previous fork release: a merged
          # PR reads as its title and number, a direct commit as its subject.
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            git -C source rev-list --first-parent "${PREVIOUS_TAG}..${RELEASE_SHA}" > "${RUNNER_TEMP}/commits"
            total="$(wc -l < "${RUNNER_TEMP}/commits")"
            {
              printf '\n## Changes since %s\n\n' "${PREVIOUS_TAG}"
              head -n 50 "${RUNNER_TEMP}/commits" | while read -r commit; do
                subject="$(git -C source log -1 --format=%s "${commit}")"
                if [[ "${subject}" =~ ^Merge\ pull\ request\ (#[0-9]+) ]]; then
                  title="$(git -C source log -1 --format=%b "${commit}" | sed -n '/[^[:space:]]/{p;q;}')"
                  printf -- '- %s (%s)\n' "${title:-${subject}}" "${BASH_REMATCH[1]}"
                else
                  printf -- '- %s\n' "${subject}"
                fi
              done
              if (( total > 50 )); then
                printf -- '- ... and %d more\n' "$(( total - 50 ))"
              fi
            } >> "${RUNNER_TEMP}/notes.md"
          fi
          # A pushed tag must already exist; a dispatched or automatic run
          # creates it at the planned commit.
          case "${GITHUB_EVENT_NAME}" in
            push) tag_source=(--verify-tag) ;;
            workflow_dispatch | workflow_run) tag_source=(--target "${RELEASE_SHA}") ;;
            *) echo "unexpected event ${GITHUB_EVENT_NAME}"; exit 1 ;;
          esac
          gh release create "${RELEASE_TAG}" \
            "${tag_source[@]}" \
            --title "Prime Agent (drvova build) ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest \
            release-out/prime-agent-*.tar.gz \
            release-out/*.debug.gz \
            release-out/SHA256SUMS \
            release-out/latest.json \
            release-out/stable \
            release-out/install.sh \
            release-out/install.ps1 \
            release-out/prime-switch \
            release-out/prime-switch.ps1
