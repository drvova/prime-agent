[workspace]
resolver = "2"
members = [
    "crates/pa-telemetry",
    "crates/pa-types",
    "crates/pa-log",
    "crates/pa-ai",
    "crates/pa-models",
    "crates/pa-agent",
    "crates/pa-shell",
    "crates/pa-runtime",
    "crates/pa-core",
    "crates/pa-daemon",
    "crates/pa-tui",
    "crates/pa-cli",
    "crates/pa-perf",
]

# Crossterm 0.28.1's kitty support check holds the process-wide event reader
# for 2s on terminals that do not answer. Keep its parser/queued input intact,
# but cap the query poll to 250ms (late real-terminal replies still get a chance).
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
# steel-core 0.8.3 embeds its Scheme prelude through backslash paths on Windows
# targets, which only a Windows build host can read; the vendored copy uses one
# path form everywhere so the Linux-hosted Windows cross-check compiles
# (vendor/steel-core/PRIME_AGENT_PATCH.md).
steel-core = { path = "vendor/steel-core" }
# spider 2.54.2 turns on reqwest's default features (aws-lc-rs TLS, OS proxy
# settings) for every client in the graph and builds spider_fingerprint with
# `dynamic-versions`, whose build script downloads Chrome version lists. The
# vendored copy's manifest drops both (vendor/spider/PRIME_AGENT_PATCH.md).
spider = { path = "vendor/spider" }
# spider_agent 2.54.2 (spider's model-driven automation, for `web-automate`)
# takes reqwest's default features, which every client in the graph would
# gain (aws-lc-rs TLS beside ring, OS proxy settings, HTTP/3); the vendored
# copy's manifest drops them (vendor/spider_agent/PRIME_AGENT_PATCH.md).
spider_agent = { path = "vendor/spider_agent" }
# spider_scraper 0.1.2 (spider_utils' and spider_transformations' CSS selection) is built on
# selectors 0.25, which depends on the unmaintained fxhash (RUSTSEC-2025-0057), and no
# release moves off it; the vendored copy is ported to selectors 0.37, the one lol_html
# already brings (vendor/spider_scraper/PRIME_AGENT_PATCH.md).
spider_scraper = { path = "vendor/spider_scraper" }
# brush-core 0.5.0 starts its external commands itself, listens for SIGINT, SIGTSTP and
# SIGCHLD on behalf of the whole process, cannot be stopped from outside, and runs a compound
# command in a pipeline to its end before the next stage starts. The vendored copy gives an
# embedding process a hook for each (vendor/brush-core/PRIME_AGENT_PATCH.md).
brush-core = { path = "vendor/brush-core" }
# jaq-json 2.0.3 (the built-in `jq`'s values) moves an object's last key into the place of a
# deleted one, fails an assignment through a missing parent, and prints floats as `1.0` and
# `NaN`; the vendored copy does each as jq does (vendor/jaq-json/PRIME_AGENT_PATCH.md).
jaq-json = { path = "vendor/jaq-json" }

[workspace.package]
version = "0.10.3"
edition = "2021"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map keeps insertion order (IndexMap) so every
# wire/durable JSON surface serializes in construction order — the JS object
# model the TS daemon and session files byte-emit. Without it the Map is a
# BTreeMap and every Value-built frame re-sorts its keys alphabetically,
# diverging from the TS byte stream (e.g. compaction `details` order).
# raw_value: pa-daemon needs it, so release builds already have it. Listing
# it here gives every crate the same serde_json features, so
# `cargo test -p pa-core` and `cargo test -p pa-daemon` share one build.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# The in-process Scheme kernel (pa-core `kernel::scheme`). `sync` makes an engine `Send`, so a
# session's engine can run on a blocking thread and the spare can live in a static.
steel-core = { version = "0.8.3", features = ["sync"] }
tracing = { version = "0.1", features = ["attributes"] }
pa-telemetry = { path = "crates/pa-telemetry" }
pa-types = { path = "crates/pa-types" }
pa-ai = { path = "crates/pa-ai" }
pa-agent = { path = "crates/pa-agent" }
pa-shell = { path = "crates/pa-shell" }
pa-log = { path = "crates/pa-log" }
thiserror = "2"
futures = "0.3"
toml = "0.9"
# Dev-only; the default fork/timeout features are unused.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The pedantic gate the five clippy campaigns earned (pa-daemon #3029,
# pa-cli #3050, pa-core #3093, the small crates #3110, pa-tui #3134):
# every workspace member is pedantic-clean; CI's -D warnings bar turns
# this warn class into errors, and the per-crate #![allow] exceptions
# (the design-choice classes, each with its in-code justification) keep
# their force under the manifest route. The group sits below the single
# lints (priority -1) so a lint set here, such as assert_is_empty, overrides it.
pedantic = { level = "warn", priority = -1 }
# Every lint exception says why, in its own `reason = ".."` (an `expect` where the lint
# fires on every build that compiles it, an `allow` only where it cannot).
allow_attributes_without_reason = "warn"
# `assert!(x.is_empty())` says what it checks; the lint's fix, an `assert_eq!` against an
# empty literal (`[] as [T; 0]`, `""`), reads worse and fails with a noisier message.
assert_is_empty = "allow"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"

# Dev and test builds (the test profile inherits dev) keep file:line in
# backtraces for workspace code and skip debuginfo for dependencies. Full
# debuginfo made incremental test rebuilds mostly link time and target/
# several times larger. For a debugger session with locals and types in
# workspace code, build with CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The Scheme kernel builds one interpreter per worker process. Unoptimized,
# that build costs about 2.8 s of CPU against 0.2 s optimized, which is
# enough to push multi-session e2e tests past their deadlines on a loaded box.
[profile.dev.package.steel-core]
opt-level = 3
debug = false

# Shipping posture, pinned (Kevin, Option C): thin LTO plus 4 codegen
# units for cross-crate inlining in the hot render path. Builds emit line
# tables and do NOT strip at link: the release pipeline's split_debug step
# produces the SHIPPED binary (objcopy --strip-debug — DWARF gone, function
# names stay) and the split-debug decoder sidecar (objcopy
# --only-keep-debug, gzipped) from the SAME linked image, so the decoder's
# addresses match the shipped binary exactly. A second unstripped build
# would NOT match: link-stage layout differs when stripping runs at link
# (measured: .text sha256 differs between the link-strip and no-strip
# builds of the same source). TRADEOFF, stated explicitly: the shipped
# binary's panic backtraces keep function names but lose file:line; the
# decoder restores file:line offline and ships as a SEPARATE release
# asset, never install payload (assemble_artifacts.py hard-fails on
# decoder sidecars). .dynsym survives stripping, so dynamic linking and
# the release GLIBC baseline gate are unaffected. macOS is unchanged:
# darwin builds keep line tables in the executable (dSYM extraction is a
# documented follow-up); byte claims are measured on Linux x86_64 ELF
# only.
[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
