[package]
name = "pa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session engine: tools, skills, prompts, kernel, subagents, settings."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
steel-core.workspace = true
tracing.workspace = true
pa-types.workspace = true
pa-ai.workspace = true
pa-models = { path = "../pa-models" }
pa-agent.workspace = true
pa-shell.workspace = true
pa-telemetry.workspace = true
base64 = "0.22"
# The Scheme kernel's `attach-image`: decode, scale and re-encode images, as
# the Python kernel did with Pillow. The same crate and formats pa-tui uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fancy-regex = "0.14"
# The traces browser login's auth challenge (RSA-2048 keypair, OAEP-SHA256
# result decrypt; sha2 matches the workspace's version, pem for the SPKI
# wire form).
rsa = { version = "0.9", features = ["sha2", "pem"] }
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "user", "fs", "dir"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
getrandom = "0.3"
url = "2"
globset = "0.4"
toml.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "gzip", "query", "form"] }
# `web-crawl`: spider's frontier (robots.txt, depth, page limits, include and
# exclude patterns, sitemaps) over pa-core's own bounded fetch. No default
# features: those spoof the user agent, open a sqlite store and start
# io_uring and NUMA threads. `chrome` drives a local browser for
# `#:render #t`; the browser process itself is started by `web_crawl`.
# `ua_generator` (real browser user agents) and `socks` (SOCKS5 proxies) serve
# only the user's `web.crawl.rotateUserAgent` and `web.crawl.proxies` settings.
# `chrome_intercept` and `adblock` (spider's built-in filter list; not
# `adblock_easylist`, which downloads EasyList at build time) serve a rendered
# crawl's `#:block` and the `web.crawl.auth` credentials.
spider = { version = "=2.54.2", default-features = false, features = ["sync", "regex", "headers", "sitemap", "chrome", "chrome_intercept", "adblock", "smart", "ua_generator", "socks"] }
# Checks `web-crawl`'s include and exclude patterns as spider will compile them.
regex = "1"
tar = "0.4"
flate2 = "1"
unicode-normalization = "0.1"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
ignore = "0.4"
# `web.read`'s PDF text (arXiv papers and any PDF URL), page by page.
pdf-extract = "0.12"
# The kernel's `fs.grep`: ripgrep's own searcher and regex matcher, in
# process (with `ignore`/`globset` above for the walk and the globs).
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }
# The traces rate-gate test runs on paused tokio time (the 12s platform
# interval auto-advances).
tokio = { workspace = true, features = ["test-util"] }
# Model-checks the kernel's thread hand-offs over the interleavings of
# their threads (`src/kernel/scheme/interleavings.rs`). Tests only: it never
# ships.
loom = "0.7"

[lints.clippy]
# pa-core keeps its OWN lints table (not `workspace = true`): the
# workspace's `rust.unsafe_code = "forbid"` would outlaw the platform
# bindings' legitimate unsafe blocks (process/termios/lock-dir). The
# clippy rows mirror the workspace table, and the pedantic class rides
# here so CI's -D warnings bar enforces it on this crate too.
pedantic = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"
