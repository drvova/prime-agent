internal_host_requests = ["bash.completed", "bash.consumed", "tests.summary", "command_cache.fact", "shell.fact"]

[[telemetry]]
event = "agent test summaries"
properties = [
  "test_summary_count",
  "test_summary_failing_count",
  "test_summary_failed_test_count",
  "test_summary_failure_handle_count",
  "test_summary_stored_count",
]

[[telemetry]]
event = "agent readonly cache"
properties = [
  "readonly_cache_hit_count",
  "readonly_cache_miss_count",
  "readonly_cache_fs_read_hit_count",
  "readonly_cache_fs_read_miss_count",
]

[[telemetry]]
event = "agent builtin shell"
properties = [
  "builtin_shell_command_count",
  "builtin_shell_in_process_count",
  "builtin_shell_spawned_count",
  "builtin_shell_handed_over_count",
  "builtin_shell_unavailable_count",
]
