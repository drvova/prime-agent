module = "rlm.better"
closure_seed = true
probe = [
  "import rlm.better as _better",
  "assert callable(_better.better)",
  "assert callable(_better.better.checks) and callable(_better.better.evidence)",
]

[[telemetry]]
event = "agent better prompt"
properties = [
  "better_run_count",
  "better_completed_count",
  "better_cancelled_count",
  "better_failed_count",
  "better_sent_as_is_count",
  "better_edited_count",
  "better_discarded_count",
  "better_brief_run_count",
  "better_brief_unchanged_count",
  "better_verification_pass_count",
  "better_check_round_count",
  "better_check_passed_count",
  "better_check_failed_count",
]
