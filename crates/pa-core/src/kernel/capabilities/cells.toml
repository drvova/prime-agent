internal_host_requests = ["cell.completed", "cell.consumed", "call.refused"]

[[telemetry]]
event = "agent repl background cells"
properties = [
  "cell_backgrounded_count",
  "cell_background_ok_count",
  "cell_background_error_count",
  "cell_background_interrupted_count",
  "cell_window_learned_count",
  "cell_window_timeout_count",
  "cell_window_setting_count",
  "cell_window_default_count",
]

[[telemetry]]
event = "agent kernel call refusals"
properties = [
  "call_refused_unknown_option_count",
  "call_refused_repeated_option_count",
  "call_refused_option_without_value_count",
  "call_refused_arity_count",
  "call_refused_tool_argument_count",
]

[[telemetry]]
event = "agent kernel waits"
properties = [
  "wait_until_count",
  "wait_until_met_count",
  "wait_until_timed_out_count",
]

[[telemetry]]
event = "agent kernel reference lookups"
properties = ["api_help_count", "api_search_count", "api_search_miss_count"]
