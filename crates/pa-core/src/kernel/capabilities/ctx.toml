module = "rlm.ctx"
closure_seed = true
bound_module = "ctx"
probe = [
  "import rlm.ctx as _ctx",
  "assert all(callable(getattr(_ctx, _m, None)) for _m in ('page', 'grep', 'tail', 'info'))",
]

[[telemetry]]
event = "agent context paging"
properties = [
  "spill_count",
  "spill_bytes_bucket",
  "spill_not_stored_count",
  "spill_evicted_count",
  "ctx_page_count",
  "ctx_grep_count",
  "ctx_tail_count",
  "ctx_info_count",
]
