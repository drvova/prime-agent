internal_host_requests = ["edit_check.fact", "edit.fact"]

[[telemetry]]
event = "agent fs search"
properties = [
  "fs_grep_count",
  "fs_glob_count",
  "fs_find_count",
  "fs_search_failed_count",
  "fs_search_truncated_count",
  "fs_search_result_count",
  "fs_search_max_ms",
]

[[telemetry]]
event = "agent fs edit"
properties = [
  "fs_read_count",
  "fs_read_line_count",
  "fs_read_failed_count",
  "fs_edit_count",
  "fs_edit_op_count",
  "fs_edit_rejected_count",
  "fs_edit_stale_anchor_count",
  "fs_edit_failed_count",
  "fs_write_count",
  "fs_write_created_count",
  "fs_write_failed_count",
]

[[telemetry]]
event = "agent edit checks"
properties = [
  "edit_check_run_count",
  "edit_check_found_count",
  "edit_check_late_count",
  "edit_check_skipped_count",
  "edit_check_failed_count",
]

[[telemetry]]
event = "agent symbol index"
properties = [
  "symbol_query_count",
  "symbol_query_partial_count",
  "symbol_definition_count",
  "symbol_reference_count",
]

[[telemetry]]
event = "agent prefetch"
properties = [
  "prefetch_read_count",
  "prefetch_issued_count",
  "prefetch_used_count",
  "prefetch_unused_count",
  "prefetch_skipped_count",
]

[[telemetry]]
event = "agent fs rereads"
properties = ["fs_reread_unchanged_count", "fs_reread_diff_count", "fs_reread_full_count"]

[[telemetry]]
event = "agent edit matches"
properties = [
  "edit_exact_count",
  "edit_trailing_whitespace_count",
  "edit_indentation_count",
  "edit_unicode_punctuation_count",
  "edit_unescaped_count",
  "edit_anchor_prefix_refused_count",
  "edit_ambiguous_count",
  "edit_not_found_count",
]
