module = "rlm.web"
closure_seed = true
bound_module = "web"
probe = [
  "import rlm.web as _web",
  "assert callable(_web.search)",
  "assert callable(_web.read)",
]

[[telemetry]]
event = "agent web reads"
properties = [
  "web_read_count",
  "web_read_failed_count",
  "web_read_site_count",
  "web_read_pdf_count",
  "web_read_page_count",
  "web_read_truncated_count",
  "web_read_max_ms",
]
