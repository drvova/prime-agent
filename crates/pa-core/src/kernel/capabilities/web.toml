[[telemetry]]
event = "agent web reads"
properties = [
  "web_read_count",
  "web_read_failed_count",
  "web_read_site_count",
  "web_read_pdf_count",
  "web_read_page_count",
  "web_read_truncated_count",
  "web_read_max_ms",
]

[[telemetry]]
event = "agent web crawls"
properties = [
  "web_crawl_count",
  "web_crawl_failed_count",
  "web_crawl_plain_count",
  "web_crawl_rendered_count",
  "web_crawl_smart_count",
  "web_crawl_page_count",
  "web_crawl_identity_count",
  "web_crawl_max_ms",
  "web_screenshot_count",
  "web_pdf_count",
  "web_capture_failed_count",
]
