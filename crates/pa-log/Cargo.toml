[package]
name = "pa-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prime Agent's SQLite store: the event log and the session transcripts"

[dependencies]
pa-types = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# SQLite, compiled from its bundled source so every platform runs the same
# version with no system library: the one owner of the database is this crate.
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
# Vector newline search when a transcript's bytes are split into lines.
memchr = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
