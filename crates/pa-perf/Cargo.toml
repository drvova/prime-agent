# pa-perf: the performance corpus generator + bench harness (dev/CI tooling).
# Top of the dependency graph: nothing depends on it, and it never ships —
# the release lanes build only `-p pa-cli --bin prime-agent`.
[package]
name = "pa-perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# CLI parsing: the workspace already resolves clap for pa-tui.
clap = { version = "4", features = ["derive"] }
[target.'cfg(unix)'.dependencies]
# The screen model for content needles the raw byte stream cannot see (the
# agents view's `Inactive (N)` heading repaints as cell diffs on big
# corpora). MIT, no_std-free, never shipped — the only new third-party dep
# this crate carries (see README + the PR body). Unix only, like the pty
# harness that reads it.
vt100 = "0.15"
# pty + poll for the bench harness: the same nix version the workspace
# already resolves for pa-core/pa-cli.
# `feature` provides sysconf(CLK_TCK) for idle-cost's /proc tick counts.
nix = { version = "0.29", features = ["term", "signal", "process", "fs", "poll", "feature"] }

[dependencies.pa-types]
path = "../pa-types"

[dependencies.pa-core]
path = "../pa-core"

[dev-dependencies]
tempfile = "3"

# The library's rows/entries ride the product's own serializers (pa-types
# payloads in the `FileEntry` rows pa-core's session manager writes), so generated corpora exercise
# the exact wire format the product reads.

[lints]
workspace = true
