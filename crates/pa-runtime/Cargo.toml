[package]
name = "pa-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prime Agent's event-driven runtime: the bus, subscriptions, per-session task lanes and the sessions that run them."

[dependencies]
pa-types.workspace = true
pa-log.workspace = true
# Event sources (timers, folder watches) the runtime starts and stops by its
# subscriptions; pa-sources is a lower crate that knows nothing of the bus.
pa-sources.workspace = true
pa-core = { path = "../pa-core" }
pa-agent.workspace = true
# The RPC mode's model commands read pa-ai's registry and model types
# (`set_model`, `cycle_model`, `get_available_models`).
pa-ai.workspace = true
tokio.workspace = true
# The RPC mode's signal exit cancels an in-flight session replacement.
tokio-util = "0.7"
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Session and task ids: UUIDv7, the transcript store's own session-id form;
# a subagent's handle (`sub-<8 hex>`): random, UUIDv4.
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
# `test-util` (tokio time pause) is test-only: the throttle, debounce and
# lane-cap tests run on paused time.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
# The boundary's telemetry test reads pa-telemetry's mock sink (the turn-driver
# and session-runner tests drive real engines on pa-ai's faux provider, a
# normal dependency).
pa-telemetry.workspace = true
futures.workspace = true

[lints]
workspace = true
