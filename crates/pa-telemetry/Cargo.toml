[package]
name = "pa-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modular telemetry: event schema, queueing, and sinks for Prime Agent."

[dependencies]
anyhow.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# ring as the process's rustls crypto provider when a sink builds its own
# client: reqwest 0.13 brings no provider of its own without aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["system", "fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
