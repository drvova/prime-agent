# cargo-deny configuration for the prime-agent Rust workspace.
# Runs in CI (ci.yml) and locally via `make deny`.

[graph]
all-features = true

[advisories]
version = 2
# Fail the build on any reachable vulnerability or withdrawn advisory.
yanked = "deny"
# Also report unsound advisories for transitive crates (the default covers
# only direct dependencies of workspace crates).
unsound = "all"
# Triaged exceptions — every entry must carry a reason and a review date;
# a landed fix upstream means the entry is removed instead of silenced.
ignore = [
  # Marvin Attack timing sidechannel in rsa; no patch exists upstream
  # (RustCrypto/RSA#626 tracks it). The Prime browser login
  # (pa-core/src/auth/prime_traces.rs, run_prime_browser_login) generates a
  # fresh 2048-bit key per login and OAEP-decrypts exactly one challenge
  # result with it, locally. The attack needs many timed decryptions under one
  # key, so no oracle exists. pa-cli uses it only in tests. Reviewed
  # 2026-11-11; re-triage when rsa publishes a fix.
  { id = "RUSTSEC-2023-0071", reason = "unpatched upstream; pa-core decrypts one local OAEP login result per fresh key, no repeated-decryption oracle (reviewed 2026-11-11)" },
  # `paste` proc-macro is unmaintained; pulled by ratatui (build-time only,
  # no vulnerable code path). Reviewed 2026-09-17; revisit when ratatui
  # drops the dep.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via ratatui, build-time only (reviewed 2026-09-17)" },
  # lru 0.12.5 is pulled only by ratatui 0.29, whose private thread-local
  # layout cache (src/layout/layout.rs) calls only get_or_insert and resize:
  # it never constructs IterMut (0002) or calls pop (0253), and its
  # (Rect, Layout) keys have no custom Drop. The fixed lru releases are outside
  # ratatui 0.29's ^0.12 requirement. Reviewed 2026-11-11; drop both entries
  # with the ratatui upgrade.
  { id = "RUSTSEC-2026-0002", reason = "lru via ratatui 0.29; its layout cache never constructs IterMut (reviewed 2026-11-11)" },
  { id = "RUSTSEC-2026-0253", reason = "lru via ratatui 0.29; its layout cache never calls pop, keys have no custom Drop (reviewed 2026-11-11)" },
  # ttf-parser is unmaintained (no known vulnerability); lopdf 0.42 depends on
  # it unconditionally to read embedded fonts, and pa-core reaches lopdf only
  # through pdf-extract for `web.read`'s PDF text, on a dedicated big-stack
  # thread. Reviewed 2026-11-19; drop with the lopdf release that moves off it.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained, no vulnerability; via lopdf/pdf-extract for web.read PDF text (reviewed 2026-11-19)" },
  # im, im-rc and sized-chunks come only through steel-core 0.8.3 (the Scheme
  # kernel's persistent vectors, hash maps and hash sets). All three are
  # archived upstream with no fixed release. steel-core's `imbl` feature is no
  # way out: it keeps im-rc in the graph and its imbl-sized-chunks 0.1.x has
  # the same flaw (RUSTSEC-2026-0292), fixed only in 0.2.0, which steel-imbl
  # cannot take. Accepted by the owner 2026-11-22; drop these entries with the
  # steel-core release that moves off the crates.
  { id = "RUSTSEC-2026-0248", reason = "im unmaintained; via steel-core only, no maintained path in 0.8.3 (reviewed 2026-11-22)" },
  { id = "RUSTSEC-2026-0250", reason = "im-rc unmaintained; a non-optional steel-core dependency (reviewed 2026-11-22)" },
  { id = "RUSTSEC-2026-0251", reason = "sized-chunks unmaintained; via im/im-rc under steel-core (reviewed 2026-11-22)" },
  # Also unmaintained with no vulnerability reported, and also only under
  # steel-core: bitmaps through im/im-rc, bincode and chrono directly.
  # Accepted by the owner 2026-11-22.
  { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained; via im/im-rc under steel-core (reviewed 2026-11-22)" },
  { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained, no vulnerability; a steel-core dependency (reviewed 2026-11-22)" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no vulnerability; a steel-core dependency (reviewed 2026-11-22)" },
  # The aliasing violation is in `OrdSet` insertion; steel-core 0.8.3 uses
  # im's Vector, HashMap and HashSet and never names OrdSet or OrdMap.
  { id = "RUSTSEC-2023-0126", reason = "im OrdSet insertion; steel-core never uses OrdSet/OrdMap (reviewed 2026-11-22)" },
  # A double free needs an element's `Drop` to panic while a chunk is being
  # cleared or trimmed. The elements are Steel values; a cell cannot define a
  # destructor, and the host types the kernel registers do not panic in Drop.
  # steel-core does not use RingBuffer or InlineArray. Not ruled out for a
  # future host type: one whose Drop can panic must not be stored in a Steel
  # collection.
  { id = "RUSTSEC-2026-0255", reason = "sized-chunks panic-safety; needs a panicking Drop of a Steel value, which cells cannot define (reviewed 2026-11-22)" },
]

[licenses]
version = 2
# Deny-by-default; the allowlist below is the exact set carried by the
# dependency graph (verified with `cargo deny check licenses`).
# The exact set carried by the dependency graph (verified with
# `cargo deny check licenses`); unmatched entries are removed on bump.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # notify (the `@` file index watcher) — CC0 public domain dedication.
  "CC0-1.0",
  # steel-core (the in-process Scheme kernel) depends on im, im-rc, bitmaps and sized-chunks,
  # all MPL-2.0-or-later: file-level copyleft, linked unmodified. Accepted by the owner 2026-11-21.
  "MPL-2.0",
]
# Development-only tools are not shipped; we keep the graph tight instead of
# adding private/exceptions stanzas.

[bans]
# Multiple versions of a crate are allowed (few genuine duplicates exist and
# cargo resolves them fine); duplicates and wildcards are surfaced instead.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Everything must come from crates.io or vendored path dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
