module = "rlm.better"
closure_seed = true
prompt_builtins = ["better"]
documented = ["better"]
probe = ["import rlm.better as _better", "assert callable(_better.better)"]

[host_requests]
"better.run" = "better"

[[telemetry]]
event = "agent better prompt"
properties = [
  "better_run_count",
  "better_completed_count",
  "better_cancelled_count",
  "better_failed_count",
  "better_sent_as_is_count",
  "better_edited_count",
  "better_discarded_count",
  "better_brief_run_count",
  "better_brief_unchanged_count",
  "better_verification_pass_count",
]
