module = "rlm.checkpoint"
closure_seed = true
bound_module = "checkpoint"
prompt_builtins = ["checkpoint.*"]
documented = ["checkpoint.create", "checkpoint.list", "checkpoint.restore"]
probe = [
  "import rlm.checkpoint as _checkpoint",
  "assert all(callable(getattr(_checkpoint, _m, None)) for _m in ('create', 'list', 'restore'))",
]

[host_requests]
"checkpoint.create" = "checkpoint.create"
"checkpoint.list" = "checkpoint.list"
"checkpoint.restore" = "checkpoint.restore"

[[telemetry]]
event = "agent repl checkpoint"
properties = [
  "checkpoint_created_count",
  "checkpoint_list_count",
  "checkpoint_restored_count",
  "checkpoint_restore_declined_count",
  "checkpoint_restore_disabled_count",
  "checkpoint_failed_count",
]
