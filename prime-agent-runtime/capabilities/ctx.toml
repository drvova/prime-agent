module = "rlm.ctx"
closure_seed = true
bound_module = "ctx"
prompt_builtins = ["ctx.*"]
documented = ["ctx.page", "ctx.grep", "ctx.tail", "ctx.info"]
probe = [
  "import rlm.ctx as _ctx",
  "assert all(callable(getattr(_ctx, _m, None)) for _m in ('page', 'grep', 'tail', 'info'))",
]

[host_requests]
"ctx.page" = "ctx.page"
"ctx.grep" = "ctx.grep"
"ctx.tail" = "ctx.tail"
"ctx.info" = "ctx.info"
