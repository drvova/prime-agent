module = "rlm.decision"
closure_seed = true
documented = ["rlm.decide"]
probe = [
  "import rlm.decision as _decision",
  "assert callable(_decision.decide)",
  "assert callable(rlm.rlm.decide)",
]

[host_requests]
"rlm.decide" = "rlm.decide"

[[telemetry]]
event = "agent repl decide"
properties = ["decide_count", "decide_limited_count", "decide_failed_count"]
