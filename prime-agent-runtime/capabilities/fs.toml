module = "rlm.fs"
closure_seed = true
bound_module = "fs"
prompt_builtins = ["fs.*"]
documented = ["fs.grep", "fs.glob", "fs.find", "fs.read", "fs.edit"]
internal_host_requests = ["edit_check.fact"]
probe = [
  "import rlm.fs as _fs",
  "assert all(callable(getattr(_fs, _m, None)) for _m in ('grep', 'glob', 'find', 'read', 'edit'))",
  "assert issubclass(_fs.StaleAnchorsError, RuntimeError)",
]

[host_requests]
"fs.grep" = "fs.grep"
"fs.glob" = "fs.glob"
"fs.find" = "fs.find"
"fs.read" = "fs.read"
"fs.edit" = "fs.edit"

[[telemetry]]
event = "agent fs search"
properties = [
  "fs_grep_count",
  "fs_glob_count",
  "fs_find_count",
  "fs_search_failed_count",
  "fs_search_truncated_count",
  "fs_search_result_count",
  "fs_search_max_ms",
]

[[telemetry]]
event = "agent fs edit"
properties = [
  "fs_read_count",
  "fs_read_line_count",
  "fs_read_failed_count",
  "fs_edit_count",
  "fs_edit_op_count",
  "fs_edit_rejected_count",
  "fs_edit_stale_anchor_count",
  "fs_edit_failed_count",
]

[[telemetry]]
event = "agent edit checks"
properties = [
  "edit_check_run_count",
  "edit_check_found_count",
  "edit_check_late_count",
  "edit_check_skipped_count",
  "edit_check_failed_count",
]
