module = "rlm.model"
closure_seed = true
bound_module = "model"
prompt_builtins = ["model.*"]
documented = ["model.info", "model.set_effort"]
probe = [
  "import rlm.model as _model",
  "assert callable(_model.set_effort)",
  "assert callable(_model.info)",
]

[host_requests]
"model.info" = "model.info"
"model.set_effort" = "model.set_effort"

[[telemetry]]
event = "agent repl notify"
properties = ["effort_set_count", "effort_refused_count"]
