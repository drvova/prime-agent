module = "rlm.schedule"
closure_seed = true
bound_module = "schedule"
prompt_builtins = ["schedule.*"]
documented = ["schedule.add", "schedule.list", "schedule.cancel"]
probe = [
  "import rlm.schedule as _schedule",
  "assert all(callable(getattr(_schedule, _m, None)) for _m in ('add', 'list', 'cancel'))",
]

[host_requests]
"schedule.add" = "schedule.add"
"schedule.list" = "schedule.list"
"schedule.cancel" = "schedule.cancel"

[[telemetry]]
event = "agent repl schedule"
properties = [
  "schedule_once_added_count",
  "schedule_recurring_added_count",
  "schedule_list_count",
  "schedule_cancelled_count",
  "schedule_rejected_count",
]
