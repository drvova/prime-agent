module = "rlm"
closure_seed = false
documented = ["rlm.session.messages", "rlm.session.search", "rlm.session.tool_result"]
probe = ["assert callable(rlm.rlm.session.search)"]

[host_requests]
"rlm.session.search" = "rlm.session.search"
"rlm.session.tool_result" = "rlm.session.tool_result"
"rlm.session.saved_messages" = "rlm.session.messages"
"rlm.session.messages" = "rlm.session.messages"
"agent_observe.session_messages" = "rlm.session.messages"

[[telemetry]]
event = "agent kernel login and recall"
properties = [
  "session_search_count",
  "session_search_hit_count",
  "session_search_read_count",
  "session_search_failed_count",
]
