module = "rlm.settings"
closure_seed = true
bound_module = "settings"
prompt_builtins = ["settings.*"]
documented = ["settings.get"]
probe = ["import rlm.settings as _settings", "assert callable(_settings.get)"]

[host_requests]
"settings.session" = "settings.get"
"settings.host" = "settings.get"

[[telemetry]]
event = "agent repl reload"
properties = ["repl_settings_get_count"]
