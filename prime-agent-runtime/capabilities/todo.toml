module = "rlm.todo"
closure_seed = true
bound_module = "todo"
prompt_builtins = ["todo.*"]
documented = ["todo.set", "todo.update", "todo.get"]
probe = [
  "import rlm.todo as _todo",
  "assert all(callable(getattr(_todo, _m, None)) for _m in ('get', 'set', 'update'))",
]

[host_requests]
"todo.set" = "todo.set"
"todo.update" = "todo.update"
"todo.get" = "todo.get"

[[telemetry]]
event = "agent todos and questions"
properties = ["todo_list_set_count", "todo_item_done_count"]
