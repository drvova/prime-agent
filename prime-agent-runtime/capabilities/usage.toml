module = "rlm.usage"
closure_seed = true
bound_module = "usage"
prompt_builtins = ["usage.*"]
documented = ["usage.get"]
probe = ["import rlm.usage as _usage", "assert callable(_usage.get)"]

[host_requests]
"usage.session" = "usage.get"
"usage.quotas" = "usage.get"

[[telemetry]]
event = "agent usage reads"
properties = ["usage_read_count"]
