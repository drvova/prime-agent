module = "rlm.web"
closure_seed = true
bound_module = "web"
prompt_builtins = ["web.*"]
documented = ["web.search", "web.read"]
probe = [
  "import rlm.web as _web",
  "assert callable(_web.search)",
  "assert callable(_web.read)",
]

[host_requests]
"web.search" = "web.search"
"web.read" = "web.read"

[[telemetry]]
event = "agent web reads"
properties = [
  "web_read_count",
  "web_read_failed_count",
  "web_read_site_count",
  "web_read_pdf_count",
  "web_read_page_count",
  "web_read_truncated_count",
  "web_read_max_ms",
]
