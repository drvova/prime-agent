[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  # Transitive via mcp; direct floors because the release bootstrap installs without uv.lock.
  "pyjwt>=2.15,<3",
  "opentelemetry-api>=1.45.1,<2",
  "tyro",
]

[dependency-groups]
# The runtime suite also runs rlm.frida's live test against the pinned frida wheels, which the
# host installs into the kernel venv after it is ready (pa-core's FRIDA_PACKAGES); keep the pins equal.
dev = ["dill", "frida==17.27.2", "frida-tools==14.13.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
